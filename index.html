<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kalkulator RD Reseller</title>

<style>
body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  padding:20px;
}

.card{
  background:white;
  border-radius:15px;
  padding:20px;
  box-shadow:0 2px 10px rgba(0,0,0,.1);
}

input{
  width:100%;
  padding:12px;
  font-size:20px;
  box-sizing:border-box;
}

.hasil{
  margin-top:20px;
  font-size:32px;
  font-weight:bold;
  color:#0d6efd;
  text-align:center;
}
</style>
</head>

<body>

<div class="card">
<h2>💎 Kalkulator RD Reseller</h2>

<input
type="number"
id="uang"
placeholder="Masukkan nominal rupiah"
oninput="hitung()">

<div class="hasil" id="hasil">
0 Diamond
</div>

<p>Tarif: Rp10.000 = 37.100 Diamond</p>

</div>

<script>
function hitung(){
  let uang =
  Number(document.getElementById('uang').value);

  let diamond =
  Math.floor(uang * 3.71);

  document.getElementById('hasil').innerHTML =
  diamond.toLocaleString('id-ID') + ' Diamond';
}
</script>

</body>
</html>
